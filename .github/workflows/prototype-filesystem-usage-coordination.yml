name: Throwaway filesystem usage coordination prototype

on:
  push:
    branches:
      - prototype/filesystem-usage-coordination
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenarios:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all prototype scenarios
        run: pnpm prototype:usage-coordination --all
